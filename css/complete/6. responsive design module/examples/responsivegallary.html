<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gal{
            display: flex;
            list-style: none;
            flex-wrap: wrap;
            padding:10px 50px;
            justify-content: space-around;
        }
        .gal li{
            width:25%;
            box-sizing: border-box;

        }
        .gal li img{
            border-radius: 10px;
            width:90%;
        }
        @media screen and (max-width:960px) {
            .gal{
                padding:10px;
            }
            .gal li{
                width:33%;
                box-sizing: border-box;
            }
        }
        @media screen and (max-width:800px) {
            .gal li{
                width:50%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <ul class="gal">
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/01.jpg" alt="">
        </li>
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/02.jpg" alt="">
        </li>
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/03.jpg" alt="">
        </li>
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/04.jpg" alt="">
        </li>
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/05.jpg" alt="">
        </li>
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/06.jpg" alt="">
        </li>
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/07.jpg" alt="">
        </li>
        <li>
            <img src="https://silicon.createx.studio/assets/img/team/08.jpg" alt="">
        </li>
    </ul>
</body>
</html>
