<html>
    <head>
		<script src="https://unpkg.com/react@16/umd/react.production.min.js"></script>
		<script src="https://unpkg.com/react-dom@16/umd/react-dom.production.min.js"></script>
		<script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </head>
    <body>		
		<div id="root">
			
		</div>
		<script type="text/babel">
			class Header extends React.Component{
				render(){
					return(
						<nav className={"navbar navbar-expand-sm  bg-"+this.props.nstyle+" navbar-dark"}>
						  <ul class="navbar-nav">
							{
								this.props.links.map((link)=>{
									return(
										<li class="nav-item active">
										  <a class="nav-link" href="#">{link}</a>
										</li>
									)
								})
							}							
						  </ul>
						</nav>
					)
				}
			}
			class Footer extends React.Component{
				render(){
					return(
						<nav class="navbar navbar-expand-sm bg-secondary navbar-dark fixed-bottom">
						  <ul class="navbar-nav">
							<li class="nav-item active">
							  <a class="nav-link" href="#">Active</a>
							</li>
							<li class="nav-item">
							  <a class="nav-link" href="#">Link</a>
							</li>
							<li class="nav-item">
							  <a class="nav-link" href="#">Link</a>
							</li>
							<li class="nav-item">
							  <a class="nav-link disabled" href="#">Disabled</a>
							</li>
						  </ul>
						</nav>
					)
				}
			}
			class Mainarea extends React.Component{
				render(){
					return(
						<div class="jumbotron jumbotron-fluid">
						  <div class="container">
							<h1>Bootstrap Tutorial</h1>      
							<p>Bootstrap is the most popular HTML, CSS, and JS framework for developing responsive, mobile-first projects on the web.</p>
						  </div>
						</div>
					)
				}
			}
			class App extends React.Component{
				constructor(){
					super();
					this.state={
						header1links:['home','aboutus','careers'],
						header2links:['Angular','React','Nodejs','MongoDB','ExpressJS','Salesforce','DigitalMarketing'],
					}
				}
				render(){
					return(
						<div>
							<Header links={this.state.header1links} nstyle="danger"></Header>
							<Header links={this.state.header2links} nstyle="info"></Header>
							<Mainarea></Mainarea>
							<Footer></Footer>
						</div>
					)
				}
			}
			ReactDOM.render(<App/>,document.getElementById('root'))
		</script>
	</body>
</html>
