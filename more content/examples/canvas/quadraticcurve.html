<!DOCTYPE html>
<html>
<body>


<canvas id="myCanvas" width="500" height="700" style="border:1px solid #000000;">
Your browser does not support the HTML5 canvas tag.
</canvas>
<script>

var c=document.getElementById("myCanvas");
var ctx=c.getContext("2d");
ctx.beginPath(); 
ctx.moveTo(75, 250); // Begin at (75,250)
ctx.quadraticCurveTo(100,200, 175, 250);       // Continue with vertical line
ctx.stroke(); 
</script>
</body>
</html>
