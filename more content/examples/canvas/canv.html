<!DOCTYPE html>
<html>
<body>
<canvas id="myCanvas" width="400" height="500" style="border: 1px solid;">
</canvas>
<script>
var x=50;
var y=20;
var c=document.getElementById("myCanvas");
var ctx=c.getContext("2d");
var myVar=setInterval(function(){myTimer()},1000);
function myTimer()
{
ctx.fillStyle="#ff0000";
ctx.fillRect(x,y,150,75);
x=x+10;
y=y+10;
}

</script>
</body>
</html>
