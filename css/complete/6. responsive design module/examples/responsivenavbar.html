<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            padding:10px 50px;
        }
        .navbar .logo img{
            width:200px;
        }
        .navbar .menu{
            display: flex;
            list-style: none;
        }
        .navbar .menu li{
            width:150px;
            font-size: 1.25em;
        }
        .navbar .mobilemenu{
            font-size: 3em;
            display: none;
        }
        @media screen and (max-width:1000px) {
            .navbar .menu{
                display: none;
            }
            .navbar .mobilemenu{
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="https://edupoly.in/common/assets/edupoly-logo-light.png" alt="">
        </div>
        <ul class="menu">
            <li>Home</li>
            <li>Aboutus</li>
            <li>Contactus</li>
        </ul>
        <div class="mobilemenu">
            <i class="bi bi-list"></i>
        </div>
    </div>
   
</body>
</html>
