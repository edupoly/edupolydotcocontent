<!DOCTYPE html>
<html>
<body>
<canvas id="myCanvas" width="400" height="500" style="border: 1px solid;">
</canvas>
<script>
var x=50;
var y=20;
var c=document.getElementById("myCanvas");
var ctx=c.getContext("2d");
ctx.fillStyle="#00ff00";
ctx.beginPath();
ctx.moveTo(50,50);
ctx.lineTo(50,200);
ctx.lineTo(200,200);
ctx.lineTo(200,50);
ctx.lineTo(50,50);

ctx.moveTo(100,100);
ctx.lineTo(100,150);
ctx.lineTo(150,150);
ctx.lineTo(150,100);
ctx.lineTo(100,100);

ctx.fill("evenodd");
ctx.fillStyle = 'rgb(255,0,255)';
ctx.beginPath();
ctx.arc(75, 75, 75, 0, Math.PI*2, true);
ctx.arc(75, 75, 25, 0, Math.PI*2, true);
ctx.fill("evenodd");
//ctx.fill("evenodd");
</script>
</body>
</html>
